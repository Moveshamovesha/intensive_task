server.port=8082
spring.datasource.url=jdbc:postgresql://localhost:5432/user_db
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
server.forward-headers-strategy=framework
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
app.kafka.topic.user-events=user-events
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
resilience4j.circuitbreaker.instances.kafka-publisher.sliding-window-size=10
resilience4j.circuitbreaker.instances.kafka-publisher.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.kafka-publisher.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.kafka-publisher.permitted-number-of-calls-in-half-open-state=3